# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-secgw"
BBFILE_PATTERN_meta-secgw = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-secgw = "6"

LAYERDEPENDS_meta-secgw = "core"
LAYERSERIES_COMPAT_meta-secgw = "scarthgap"
